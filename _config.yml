title: timsonner.com
description: "Cybersecurity tools and research. Run OSINT lookups, inspect phishing emails, browse through a proxy, and catch up on security news and write-ups."
baseurl: ""
url: "https://timsonner.github.io"

# Author information
author:
  name: Tim Sonner
  email: tim@timsonner.com

# Default social image
image: /assets/images/hero-image-1240x620.jpg

header_pages:
  - news.html

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Kramdown settings for better code highlighting
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude files from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - workers

# Collections (if you want to organize content)
collections:
  posts:
    output: true
    permalink: /:categories/:year/:month/:day/:title/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Tim Sonner"
